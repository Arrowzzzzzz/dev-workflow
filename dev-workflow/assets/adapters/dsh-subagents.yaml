# dsh subagent 描述符模板 —— .devflow/agents/adapters/dsh-subagents.yaml
# 模型值取自 .devflow/agents/config.yaml 的 models.<role>.dsh（LLM adapter 注册表中的模型名），
# 本文件是配置快照：工具侧配置已存在则复用，缺失才按本模板生成。
# provider 支持 spawn/fork/acp/codex/claude-code 等提供方（见 dsh LLM adapter 注册表文档）。

subagents:
  frontend:
    description: 前端 UI 角色：页面/组件/状态管理/样式/交互
    persona: 先读项目 .devflow/agents/frontend.md（角色知识库）再执行任务
    agentOptions:
      provider: <provider>      # 如 spawn / acp
      model: deepseek-chat      # 取自 config.yaml models.frontend.dsh；未配 = 主会话默认
    toolFilter: []              # 空或不写 = 不限制工具

  backend:
    description: 后端开发角色：接口/业务逻辑/服务层
    persona: 先读项目 .devflow/agents/backend.md（角色知识库）再执行任务
    agentOptions:
      provider: <provider>
      model: deepseek-reasoner
    toolFilter: []
